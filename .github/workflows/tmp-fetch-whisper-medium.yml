name: Temporary fetch Whisper medium model

on:
  push:
    branches:
      - tmp/transcripcion-guzman-model
    paths:
      - '.github/workflows/tmp-fetch-whisper-medium.yml'

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download official whisper.cpp multilingual medium q5_0 model
        run: |
          curl -L --fail --retry 3 \
            -o ggml-medium-q5_0.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium-q5_0.bin
          ls -lh ggml-medium-q5_0.bin
      - name: Upload temporary model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-ggml-medium-q5_0
          path: ggml-medium-q5_0.bin
          retention-days: 1
