name: Build portable site

on:
  push:
    branches:
      - main
      - codex/replica-site-v57-7882327
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portable-site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portable-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
