name: Build portable site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portable-site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portable-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test library catalog
        run: npm run test:library

      - name: Test shared reader and two works
        run: npm run test:two-works

      - name: Build static site
        run: npm run build

      - name: Verify root deployment
        run: npm run verify:build

      - name: Build for GitHub Pages
        run: GITHUB_PAGES_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build

      - name: Verify static routes and assets
        run: GITHUB_PAGES_BASE="/${GITHUB_REPOSITORY#*/}/" npm run verify:build
