name: Build portable site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portable-site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portable-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test library catalog
        run: npm run test:library

      - name: Test Lionetti text reader and note-taking model
        run: npm run test:lionetti-reader

      - name: Test shared reader and two works
        run: npm run test:two-works

      - name: Test paragraph reader interactions and sentence reader regressions
        run: npm run test:reader-runtime

      - name: Test Hobsbawm resources and synchronization
        run: npm run test:hobsbawm

      - name: Test Aisenstein assets and reading
        run: npm run test:aisenstein

      - name: Test Marcaida and Scaltritti materials
        run: npm run test:marcaida

      - name: Test reusable validation against deliberate failures
        run: npm run test:work-validation

      - name: Test Scharagrodsky academic edition and acoustic boundaries
        run: npm run test:scharagrodsky

      - name: Test Soares candidate without publishing private materials
        run: npm run test:soares

      - name: Validate every registered work and local source reference
        run: npm run validate:works

      - name: Build static site
        run: npm run build

      - name: Verify root deployment
        run: npm run verify:build

      - name: Validate emitted routes and references at root
        run: npm run validate:works -- --dist dist

      - name: Build for GitHub Pages
        run: GITHUB_PAGES_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build

      - name: Verify static routes and assets
        run: GITHUB_PAGES_BASE="/${GITHUB_REPOSITORY#*/}/" npm run verify:build

      - name: Validate emitted routes and references for GitHub Pages
        run: GITHUB_PAGES_BASE="/${GITHUB_REPOSITORY#*/}/" npm run validate:works -- --dist dist
