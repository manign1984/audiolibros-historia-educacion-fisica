name: Temporary fetch Whisper small model

on:
  push:
    branches:
      - tmp/transcripcion-guzman-model
    paths:
      - .github/workflows/tmp-fetch-whisper-small.yml
  workflow_dispatch:

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download official whisper.cpp small-q5_1 model
        run: |
          curl -L --fail --retry 3 -o ggml-small-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          ls -lh ggml-small-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-ggml-small-q5_1
          path: ggml-small-q5_1.bin
          retention-days: 1
