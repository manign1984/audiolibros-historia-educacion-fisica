name: Temporary fetch Whisper model

on:
  push:
    branches:
      - tmp/transcripcion-guzman-model
    paths:
      - .github/workflows/tmp-fetch-whisper-model.yml

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download official whisper.cpp multilingual base model
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          ls -lh ggml-base-q5_1.bin
          sha256sum ggml-base-q5_1.bin

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-ggml-base-q5_1
          path: ggml-base-q5_1.bin
          retention-days: 1
          compression-level: 0
